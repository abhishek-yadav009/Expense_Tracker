<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hostel Expense Tracker</title>

  <link rel="stylesheet" href="CSS/style.css" />
</head>
<body>

  <div class="container">
    <h1>Hostel Expense Tracker</h1>

    <div class="balance-box">
      <h2>Total Balance</h2>
      <h3 id="balance">₹0</h3>
    </div>

    <div class="summary">
      <div class="income">
        <h3>Income</h3>
        <p id="income">₹0</p>
      </div>

      <div class="expense">
        <h3>Expense</h3>
        <p id="expense">₹0</p>
      </div>
    </div>

    <div class="form-section">
      <h2>Add Transaction</h2>

      <form id="transaction-form">

        <input
          type="text"
          id="text"
          placeholder="Expense Name (Food, Travel...)"
          required
        />

        <input
          type="number"
          id="amount"
          placeholder="Amount"
          required
        />

        <select id="type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>

        <button type="submit">Add Transaction</button>

      </form>
    </div>

    <div class="history">
      <h2>Transaction History</h2>

      <ul id="list"></ul>
    </div>
  </div>

  <script src="JS/main.js"></script>
</body>
</html>
